name: ctxscope report example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test cancellation contract
        id: ctxscope
        continue-on-error: true
        env:
          CTXSCOPE_REPORT_PATH: ${{ runner.temp }}/ctxscope-report.json
        run: >-
          go test
          -tags=ctxscope_demo_failure
          -run '^TestFailureDemoRendersGitHubSummary$'
          -count=1
          -v
          ./examples/cireport
      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ctxscope-report
          path: ${{ runner.temp }}/ctxscope-report.json
          if-no-files-found: error
      - name: Enforce cancellation contract
        if: steps.ctxscope.outcome == 'failure'
        run: exit 1
